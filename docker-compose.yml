# =============================================================================
# Entorno de desarrollo completo: base de datos, broker y servicio.
#
#   docker compose up -d                  levanta todo
#   docker compose up -d mongodb rabbitmq  solo la infraestructura, para
#                                          ejecutar el servicio desde el IDE
#
# Las credenciales de este archivo son las de desarrollo y no valen fuera de
# aqui. En entornos reales las inyecta la plataforma desde su almacen de
# secretos.
# =============================================================================

services:

  mongodb:
    image: mongo:7.0
    container_name: notification-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [
        "CMD",
        "mongosh",
        "--quiet",
        "--username",
        "${MONGO_USERNAME}",
        "--password",
        "${MONGO_PASSWORD}",
        "--authenticationDatabase",
        "admin",
        "--eval",
        "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"    # protocolo AMQP
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"    # consola de gestion: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local

      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_SOURCE: admin

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}


      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
    # El servicio no arranca hasta que la base de datos y el broker respondan a
    # su comprobacion de salud, no solo hasta que su contenedor exista.
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb-data:
  rabbitmq-data:
