# ---------------------------------------------------------------------------
# Perfil local: maquina del desarrollador, con la infraestructura levantada
# mediante docker compose.
#
# Este archivo SI se versiona porque no contiene ningun secreto: solo apunta a
# localhost con las credenciales por defecto de los contenedores de desarrollo.
# Cualquier valor sensible propio va en un .env, que esta ignorado por git.
# ---------------------------------------------------------------------------
spring:
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:notification}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: ${MONGO_AUTH_SOURCE:admin}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


notification:
    reconciler:
      # Configuración del reconciliador local
      enabled: true
      interval: PT30S
      batch-size: 50

    providers:
      brevo:
        api-key: ${BREVO_API_KEY}
        sender-email: ${BREVO_SENDER_EMAIL}
        sender-name: ${BREVO_SENDER_NAME:Notification Service}

logging:
  level:
    root: WARN
    co.edu.uco.notification: INFO
    org.springframework.data.mongodb: WARN
    org.mongodb.driver: WARN
    org.springframework.amqp: WARN
    com.rabbitmq.client: WARN
    org.springframework: WARN
    reactor.netty: WARN
