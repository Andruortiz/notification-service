# ---------------------------------------------------------------------------
# Perfil de desarrollo compartido.
#
# Sin valores por defecto para las credenciales: si falta una variable, el
# servicio no arranca. Es preferible fallar al arrancar que quedar apuntando en
# silencio a la base de datos equivocada.
# ---------------------------------------------------------------------------
spring:
  data:
    mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:notification}
    username: ${MONGO_USERNAME}
    password: ${MONGO_PASSWORD}
    authentication-database: ${MONGO_AUTH_SOURCE:admin}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

notification:
  rabbit:
    concurrency: 8

logging:
  level:
    co.edu.uco.notification: DEBUG
